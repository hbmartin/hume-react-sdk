name: docs

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/docs.yml'
      - 'docs/**'
      - 'package.json'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - 'tools/**'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/docs.yml'
      - 'docs/**'
      - 'package.json'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - 'tools/**'
    types: [opened, reopened, ready_for_review, synchronize]
  workflow_dispatch:

permissions:
  contents: read
  pages: read # read the Pages configuration used by configure-pages

jobs:
  build:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    concurrency:
      group: docs-build-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build documentation
        run: pnpm docs:build
      - name: Configure GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        with:
          enablement: true
      - name: Upload GitHub Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: docs/.vitepress/dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    concurrency:
      group: github-pages
      cancel-in-progress: false
    permissions:
      id-token: write # authenticate the Pages deployment with OIDC
      pages: write # publish the previously built Pages artifact
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
