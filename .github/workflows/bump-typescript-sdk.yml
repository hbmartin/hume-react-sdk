name: Bump Hume dependency

on:
  repository_dispatch:
    types: [typescript-sdk-published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Hume version to bump to (e.g., 0.15.6)'
        required: true
        type: string

concurrency:
  group: bump-hume-dependency
  cancel-in-progress: true

permissions: {}

jobs:
  bump-sdk:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the update branch and commit
      pull-requests: write # open and update the dependency pull request
    env:
      REQUESTED_VERSION: ${{ github.event.client_payload.version || inputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Update hume dependency
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$REQUESTED_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid hume version: $REQUESTED_VERSION" >&2
            exit 1
          fi
          echo "Updating hume to version $REQUESTED_VERSION"
          pnpm --recursive up "hume@$REQUESTED_VERSION"

      - name: Install dependencies
        run: pnpm install --ignore-scripts

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: |
            Bump hume dependency to ${{ env.REQUESTED_VERSION }}

          branch: bump-hume-${{ env.REQUESTED_VERSION }}
          delete-branch: true
          title: 'Bump hume to ${{ env.REQUESTED_VERSION }}'
          body: |
            ## Summary
            - Updates `hume` dependency to version ${{ env.REQUESTED_VERSION }}
            ${{ github.event.client_payload.tag && format('- Triggered by TypeScript SDK release {0}', github.event.client_payload.tag) || '- Triggered manually' }}

            ${{ github.event.client_payload.is_prerelease == 'true' && '⚠️ This is a pre-release version' || '' }}
