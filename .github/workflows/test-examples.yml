name: test-examples

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  test-examples:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check live EVI test credentials
        id: live_test_credentials
        env:
          TEST_HUME_API_KEY: ${{ secrets.TEST_HUME_API_KEY }}
          TEST_HUME_SECRET_KEY: ${{ secrets.TEST_HUME_SECRET_KEY }}
        run: |
          if [[ -n "$TEST_HUME_API_KEY" && -n "$TEST_HUME_SECRET_KEY" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout SDK repo (PR/branch)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: sdk
          ref: ${{ github.event.pull_request.head.sha || github.head_ref || github.ref }}
          fetch-depth: 0

      - name: Checkout examples repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: humeai/hume-api-examples
          # Keep the dependency-build policy below coupled to a reviewed lockfile.
          ref: 769ead8efc133da599cfe813f445b2019eabb6b2
          path: examples

      - name: Set up node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: 'sdk/.nvmrc'
          package-manager-cache: false

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.24.0
          install: false

      - name: Build React SDK
        working-directory: ./sdk
        env:
          SDK_BRANCH: ${{ github.head_ref || github.ref_name || 'unknown' }}
          SDK_REF: ${{ github.event.pull_request.head.sha || github.head_ref || github.ref }}
        run: |
          echo "=== React SDK Build Info ==="
          echo "Branch: $SDK_BRANCH"
          echo "Ref: $SDK_REF"
          echo "Commit SHA: $(git rev-parse HEAD)"
          echo "==========================="
          pnpm install --frozen-lockfile
          pnpm build
          echo "Package version: $(node -p "require('./packages/react/package.json').version")"

      - name: Pack @humeai/voice-react
        working-directory: ./sdk
        shell: bash
        run: |
          set -euo pipefail
          pnpm --dir packages/react pack --pack-destination ../..
          tarball_path=$(find . -maxdepth 1 -name 'humeai-voice-react-*.tgz' -print -quit)
          if [[ -z "$tarball_path" || ! -f "$tarball_path" ]]; then
            echo "Packed SDK tarball was not created" >&2
            exit 1
          fi
          tarball_name=$(basename -- "$tarball_path")
          if [[ ! "$tarball_name" =~ ^humeai-voice-react-[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?\.tgz$ ]]; then
            echo "Unexpected packed SDK path: $tarball_name" >&2
            exit 1
          fi
          echo "TARBALL=$tarball_name" >> "$GITHUB_ENV"

      - name: Configure example dependency build policy
        working-directory: ./examples/evi/evi-next-js-app-router-quickstart
        shell: bash
        run: |
          set -euo pipefail
          if [[ -e pnpm-workspace.yaml ]]; then
            echo "The pinned example now supplies pnpm-workspace.yaml; review and merge its policy instead of overwriting it." >&2
            exit 1
          fi
          cp ../../../sdk/.github/test-examples/pnpm-workspace.yaml pnpm-workspace.yaml

      - name: Install example deps and use packed SDK
        working-directory: ./examples/evi/evi-next-js-app-router-quickstart
        env:
          SDK_TARBALL: ${{ env.TARBALL }}
        run: |
          pnpm install --frozen-lockfile
          pnpm add "../../../sdk/$SDK_TARBALL"
          echo "=== Verifying @humeai/voice-react ==="
          INSTALLED=$(node -p "require('@humeai/voice-react/package.json').version")
          echo "Installed version: $INSTALLED"
          echo "===================="

      - name: Build example
        working-directory: ./examples/evi/evi-next-js-app-router-quickstart
        run: pnpm run build

      - name: Install Playwright browsers
        if: steps.live_test_credentials.outputs.available == 'true'
        working-directory: ./examples/evi/evi-next-js-app-router-quickstart
        run: pnpm exec playwright install --with-deps chromium

      - name: Run evi-next-js-app-router-quickstart tests
        if: steps.live_test_credentials.outputs.available == 'true'
        working-directory: ./examples/evi/evi-next-js-app-router-quickstart
        env:
          TEST_HUME_API_KEY: ${{ secrets.TEST_HUME_API_KEY }}
          TEST_HUME_SECRET_KEY: ${{ secrets.TEST_HUME_SECRET_KEY }}
        run: pnpm run test

      - name: Report skipped live EVI tests
        if: steps.live_test_credentials.outputs.available != 'true'
        run: echo "::notice::Skipping live EVI tests because test credentials are unavailable."
