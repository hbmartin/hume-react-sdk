name: test-examples

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-examples:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check live EVI test credentials
        id: live_test_credentials
        env:
          TEST_HUME_API_KEY: ${{ secrets.TEST_HUME_API_KEY }}
          TEST_HUME_SECRET_KEY: ${{ secrets.TEST_HUME_SECRET_KEY }}
        run: |
          if [[ -n "$TEST_HUME_API_KEY" && -n "$TEST_HUME_SECRET_KEY" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout SDK repo (PR/branch)
        uses: actions/checkout@v4
        with:
          path: sdk
          ref: ${{ github.event.pull_request.head.sha || github.head_ref || github.ref }}
          fetch-depth: 0

      - name: Checkout examples repo
        uses: actions/checkout@v4
        with:
          repository: humeai/hume-api-examples
          path: examples

      - name: Set up node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10.20.0

      - name: Build React SDK
        working-directory: ./sdk
        env:
          SDK_BRANCH: ${{ github.head_ref || github.ref_name || 'unknown' }}
          SDK_REF: ${{ github.event.pull_request.head.sha || github.head_ref || github.ref }}
        run: |
          echo "=== React SDK Build Info ==="
          echo "Branch: $SDK_BRANCH"
          echo "Ref: $SDK_REF"
          echo "Commit SHA: $(git rev-parse HEAD)"
          echo "==========================="
          pnpm install
          pnpm build
          echo "Package version: $(node -p "require('./packages/react/package.json').version")"

      - name: Pack @humeai/voice-react
        working-directory: ./sdk
        run: |
          cd packages/react && pnpm pack
          mv humeai-voice-react-*.tgz ../..
          tarball=$(find ../.. -maxdepth 1 -name 'humeai-voice-react-*.tgz' -print -quit)
          echo "TARBALL=$(basename "$tarball")" >> "$GITHUB_ENV"

      - name: Install example deps and use packed SDK
        working-directory: ./examples/evi/evi-next-js-app-router-quickstart
        run: |
          pnpm install --frozen-lockfile
          pnpm add "../../../sdk/${{ env.TARBALL }}"
          echo "=== Verifying @humeai/voice-react ==="
          INSTALLED=$(node -p "require('@humeai/voice-react/package.json').version")
          echo "Installed version: $INSTALLED"
          echo "===================="

      - name: Build example
        working-directory: ./examples/evi/evi-next-js-app-router-quickstart
        run: pnpm run build

      - name: Install Playwright browsers
        if: steps.live_test_credentials.outputs.available == 'true'
        working-directory: ./examples/evi/evi-next-js-app-router-quickstart
        run: pnpm exec playwright install --with-deps chromium

      - name: Run evi-next-js-app-router-quickstart tests
        if: steps.live_test_credentials.outputs.available == 'true'
        working-directory: ./examples/evi/evi-next-js-app-router-quickstart
        env:
          TEST_HUME_API_KEY: ${{ secrets.TEST_HUME_API_KEY }}
          TEST_HUME_SECRET_KEY: ${{ secrets.TEST_HUME_SECRET_KEY }}
        run: pnpm run test

      - name: Report skipped live EVI tests
        if: steps.live_test_credentials.outputs.available != 'true'
        run: echo "::notice::Skipping live EVI tests because test credentials are unavailable."
